[package]
name = "disk-cleaner-xfer"
description = "PruneDisk backup engine: zero-staging CDC dedup, rate-matched compression and verified parallel packs to object storage through rclone"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "xfer"

[[bin]]
name = "prunedisk-xfer"
path = "src/main.rs"

[features]
# Broken variants for failing-first evidence only. Each makes one guard test fail; none is ever
# enabled in a build that is shipped or benchmarked.
broken-verify = []        # verified_put skips the size and checksum comparison
broken-commit-order = []  # receipts go out after the .idx alone, before the .files commit
broken-pack-offset = []   # the pack writer records an off-by-one segment offset
broken-retry = []         # a retried put skips the stat that finds an already-stored object
broken-fixed-chunks = []  # fixed 1 MiB blocks instead of content-defined chunks
broken-identity = []      # Receipt::still_matches accepts any existing path
broken-exclusion = []     # hard-link groups and symlinks reaching an excluded path are kept
broken-read-guard = []    # reads follow symlinks and skip the before/after identity checks
broken-deep = []          # verify --deep stops at the shallow listing check
broken-meta = []          # metadata capture records no xattrs and never flags incomplete
broken-restore-guards = [] # restore trusts paths, links, pack ranges, object sizes, shares and setid
broken-read-order = []    # large files read in parallel and segment tails held back
broken-repo-guards = []   # no format, object-cap or cache checks; every cache tmp file removed
broken-stats-groups = []  # uploads use rcd's default per-call stats group and never delete it
broken-serial-load = []   # backup's load phase issues its store requests one after another
broken-commit-pair = []   # readers accept a .files object whose .idx of the same seq is missing
broken-commit-spacing = [] # the one-second commit spacing runs from the end of a commit
broken-mem-plan = []      # no compression share, no rcd heap limit, glibc's default mmap threshold
broken-entry-cost = []    # an index object is decoded whole before its entries are charged
broken-hot-wake = []      # a failed pack's chunks leave the hot table without waking readers
broken-migrate-order = [] # a commit's chunks leave the hot table before the committed map has them
# Test hooks, never shipped: XFER_ABORT_BEFORE_MIGRATE aborts after a commit with packs is
# receipted, before its chunks move into the committed map (tests/crash.rs).
crash-hooks = []

[dependencies]
blake3 = "1.8"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
fastcdc = "3"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "1"
# Plain HTTP only: the engine talks to its own rclone rcd on 127.0.0.1 and nothing else.
ureq = { version = "2", default-features = false }
zstd = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
xattr = "1"

[dev-dependencies]
tempfile = "3"
