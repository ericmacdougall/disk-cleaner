[package]
name = "disk-cleaner-tui"
description = "Terminal view for disk-cleaner: size tree and developer view (read-only)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "disk_cleaner_tui"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
disk-cleaner-core = { path = "../core" }
disk-cleaner-view = { path = "../view" }
ratatui = "0.29"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
