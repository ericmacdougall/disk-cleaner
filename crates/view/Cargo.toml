[package]
name = "disk-cleaner-view"
description = "Read-only view model for the disk-cleaner terminal and desktop views: size walk, tree paging, developer view"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# File::try_lock (settings save lock) is stable from 1.89.
rust-version = "1.89"

[lib]
name = "disk_cleaner_view"

[dependencies]
disk-cleaner-core = { path = "../core" }
jwalk = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK for opening scan files without blocking on a FIFO.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[test]]
name = "perf"
path = "tests/perf.rs"
