[package]
name = "disk-cleaner-core"
description = "Read-only scan, classification, repo safety facts and dry-run planning for disk-cleaner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "disk_cleaner_core"

[dependencies]
jwalk = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
