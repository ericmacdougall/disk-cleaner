[package]
name = "disk-cleaner-core"
description = "Read-only scan, classification, repo safety facts and dry-run planning for disk-cleaner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "disk_cleaner_core"

[dependencies]
jwalk = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
thiserror = "1"
toml = "0.8"
sha1 = "0.10"
md-5 = "0.10"
hex = "0.4"

# Only the O_NONBLOCK and O_NOFOLLOW constants (no unsafe code): see src/regular.rs.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
# Directory-handle-relative open, unlink, link and stat for the apply module (no unsafe code here).
rustix = { version = "1", features = ["fs", "process", "system"] }

[features]
# Test seams for the apply module (file:// remotes treated as network, crash injection).
# Never enabled by the CLI or a release build.
test-hooks = []

[dev-dependencies]
tempfile = "3"
# The integration tests use the apply test seams; the library and the CLI never do.
disk-cleaner-core = { path = ".", features = ["test-hooks"] }
