[workspace]
members = ["crates/core", "crates/cli", "crates/view", "crates/tui"]
# The desktop app is its own Cargo workspace (it needs system webview libraries that the core
# CI jobs do not install). See apps/desktop/README.md.
exclude = ["apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ericmacdougall/disk-cleaner"

[profile.release]
lto = "thin"
