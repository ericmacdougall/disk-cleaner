<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="t">
  <title id="t">PruneDisk mark: a square divided into three blocks</title>
  <style>
    .a { fill: #0b5d56; }
    .b { fill: #b45309; }
    .c { fill: #2f5fb3; }
    @media (prefers-color-scheme: dark) {
      .a { fill: #5ed6c8; }
      .b { fill: #f0a54a; }
      .c { fill: #7aa7f0; }
    }
  </style>
  <!-- One large block that stays, two smaller blocks beside it: a treemap in three tiles. -->
  <rect class="a" x="3" y="3" width="36" height="58" rx="7"/>
  <rect class="b" x="43" y="3" width="18" height="27" rx="6"/>
  <rect class="c" x="43" y="34" width="18" height="27" rx="6"/>
</svg>
