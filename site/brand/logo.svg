<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" role="img" aria-labelledby="t">
  <title id="t">disk-cleaner</title>
  <style>
    .a { fill: #0b5d56; }
    .b { fill: #b45309; }
