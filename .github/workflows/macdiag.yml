name: macdiag

# TEMPORARY (branch diag/apply-lock-macos only): loop the apply tests on macOS to find who holds
# apply.lock after an apply returns. Never merged.
on:
  push:
    branches: ["diag/**"]

permissions:
  contents: read

jobs:
  loop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install rclone && rclone version
      - run: cargo test --workspace --locked --no-run
      - name: Loop
        env:
          RUST_BACKTRACE: "1"
        run: |
          fails=0
          for i in 1 2 3; do
            if ! cargo test --workspace --locked --no-fail-fast > run-$i.log 2>&1; then
              fails=$((fails+1)); echo "iteration $i FAILED"
              grep -E "FAILED|panicked|Locked" run-$i.log | head -20
              grep -A40 "PD-LOCK-DIAG" run-$i.log | head -120
            else
              echo "iteration $i ok"
            fi
          done
          echo "failures: $fails of 3"
          test "$fails" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loop-logs
          path: run-*.log
