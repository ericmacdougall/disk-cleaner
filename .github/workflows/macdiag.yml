name: macdiag

# TEMPORARY (branch diag/apply-lock-macos only): failing-first evidence on macOS for the apply.lock
# fix at ed00006 on feat/apply-lanes. The guard tests must pass at ed00006 and fail with the
# controlled broken variant lock-settle-zero (no wait). Never merged.
on:
  push:
    branches: ["diag/**"]

permissions:
  contents: read

jobs:
  guard:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ed00006ab2e53000e42e77cebe5ed43c2ee1baee
      - uses: dtolnay/rust-toolchain@stable
      - name: Guard tests at ed00006 (must pass)
        run: cargo test -p disk-cleaner-core --locked --test apply_lock 2>&1 | grep -E "^test |test result|takes after"
      - name: Guard tests with lock-settle-zero (must fail)
        run: |
          perl -0777 -pi -e 's/std::time::Duration::from_millis\(500\);/std::time::Duration::from_millis(0);/ or die "pattern did not apply\n"' crates/core/src/apply/run.rs
          grep -n "from_millis(0);" crates/core/src/apply/run.rs
          if cargo test -p disk-cleaner-core --locked --test apply_lock > mut.log 2>&1; then
            echo "SURVIVED"; grep -E "^test |test result" mut.log; exit 1
          fi
          echo "KILLED"; grep -E "^test |test result|takes after" mut.log
