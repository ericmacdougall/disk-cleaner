name: macdiag

# TEMPORARY (branch diag/apply-lock-macos only): find why apply.lock is still held just after an
# apply returns on macOS. Never merged.
on:
  push:
    branches: ["diag/**"]

permissions:
  contents: read

jobs:
  experiment:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Experiment
        run: cargo test -p disk-cleaner-core --locked --test lock_diag -- --nocapture 2>&1 | grep -E "PD-LOCK-EXP|test result|panicked"

  loop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install rclone && rclone version
      - run: cargo test --workspace --locked --no-run
      - name: Loop
        env:
          RUST_BACKTRACE: "1"
        run: |
          fails=0
          for i in 1 2 3; do
            export PD_LOCK_LOG="$PWD/lock-$i.log"
            if ! cargo test --workspace --locked --no-fail-fast > run-$i.log 2>&1; then
              fails=$((fails+1)); echo "iteration $i FAILED"
              grep -E "FAILED|panicked|Locked" run-$i.log | head -20
            else
              echo "iteration $i ok"
            fi
            echo "lock waits in iteration $i: $(grep -c PD-LOCK lock-$i.log 2>/dev/null || echo 0)"
            cat lock-$i.log 2>/dev/null | head -40
          done
          echo "failures: $fails of 3"
          test "$fails" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loop-logs
          path: |
            run-*.log
            lock-*.log
