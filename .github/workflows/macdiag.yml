name: macdiag

# TEMPORARY (branch diag/apply-lock-macos only): six single-shot macOS runs of the exact CI test
# command on the diagnostic tree 682d7c3, whose take_lock waits up to 3 s on EWOULDBLOCK and logs
# every wait (and how long it took to clear) to $PD_LOCK_LOG. Cleared waits in runs that pass
# link the measured race to the pre-fix CI failures; their maximum sizes LOCK_SETTLE. Never merged.
on:
  push:
    branches: ["diag/**"]

permissions:
  contents: read

jobs:
  single:
    strategy:
      fail-fast: false
      matrix:
        shot: [1, 2, 3, 4, 5, 6]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 682d7c3f638202111e769ced0ffdd15012963606
      - uses: dtolnay/rust-toolchain@stable
      - run: git --version
      - run: brew install rclone && rclone version
      - name: Test (the CI command), lock waits logged
        env:
          PD_LOCK_LOG: ${{ github.workspace }}/lock.log
        run: cargo test --workspace --locked --no-fail-fast
      - name: Lock waits
        if: always()
        run: |
          echo "cleared waits: $(grep -c cleared_ms lock.log 2>/dev/null || echo 0)"
          echo "gave up: $(grep -c gave_up lock.log 2>/dev/null || echo 0)"
          cat lock.log 2>/dev/null || true
