name: release

# Builds the command-line program for each platform, packages it with the license and README, writes
# SHA256SUMS, attests build provenance, and (for a version tag only) creates a DRAFT GitHub release.
#
#   * Push a tag like v0.1.0: builds, then creates a draft release. A maintainer reads it and
#     publishes it by hand (see docs/RELEASING.md). Nothing is published automatically.
#   * Run it by hand from the Actions tab ("Run workflow"): the rehearsal. It builds, packages and
#     attests exactly as a tag does, then keeps the files as workflow artifacts. It never creates a
#     release or a tag.
#
# The binaries are not code-signed or notarized. The release notes say so.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
    branches: [feat/release-pipeline] # TEMPORARY: rehearsal before this file is on main; remove before merge
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The binary and package names live here and nowhere else in this file. The planned rename from
  # disk-cleaner to prunedisk is a change to these two lines (and the repository slug is read from
  # github.repository, never typed here).
  BIN_NAME: disk-cleaner
  CLI_PACKAGE: disk-cleaner-cli

jobs:
  # Decides the tag and version, and refuses a release that should not happen.
  meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: meta
        name: Work out the tag and check it
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          # The workspace version, from the [workspace.package] table of Cargo.toml.
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\([^"]*\)".*/\1/p;}' Cargo.toml | head -n1)
          if [ -z "$version" ]; then echo "::error::could not read the workspace version from Cargo.toml"; exit 1; fi
          if [ "$EVENT" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
            case "$tag" in
              "v$version"|"v$version"-*) ;;
              *) echo "::error::tag $tag does not match the workspace version $version in Cargo.toml; bump the version first"; exit 1 ;;
            esac
            # A release comes from main, never from a side branch.
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $tag points at $GITHUB_SHA, which is not on main"; exit 1
            fi
            # And from a commit whose CI passed.
            ok=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
                   --status success --json conclusion --jq 'length')
            if [ "$ok" -lt 1 ]; then
              echo "::error::no successful ci.yml run for $GITHUB_SHA; fix or re-run CI first"; exit 1
            fi
            publish=true
          else
            tag="v${version}-rehearsal-${GITHUB_RUN_ID}"
            publish=false
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$tag version=$version publish=$publish"

  build:
    name: build (${{ matrix.target }})
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 so the Linux binary needs glibc 2.35, not the newest.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
          # Cross-built on the Apple Silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip
          # EXTENSION POINT (desktop bundles): the desktop app is built by its own jobs (see the
          # bundle jobs on the feat/desktop branch's ci.yml). When they are added here, each one
          # packages its installers and uploads them as an artifact named release-desktop-<target>
          # containing only the files to publish. The package job below collects every artifact
          # named release-*, writes SHA256SUMS over them and attests them with no other change.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p ${{ env.CLI_PACKAGE }}
      - name: Smoke test the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          exe="target/$TARGET/release/${BIN_NAME}${EXT}"
          test -f "$exe"
          if [ "$TARGET" = x86_64-apple-darwin ]; then
            # Built on an arm64 runner; do not assume it can be run there. Check the architecture.
            file "$exe" | tee /dev/stderr | grep -q x86_64
            exit 0
          fi
          out=$("$exe" --version)
          echo "$out"
          case "$out" in *"$VERSION"*) ;; *) echo "::error::--version does not mention $VERSION"; exit 1 ;; esac
          mkdir -p smoke/proj/node_modules
          echo hello > smoke/proj/README.md
          "$exe" scan smoke --out smoke.json
          test -s smoke.json
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          ARCHIVE: ${{ matrix.archive }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          name="${BIN_NAME}-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/${BIN_NAME}${EXT}" LICENSE README.md "dist/$name/"
          cd dist
          if [ "$ARCHIVE" = zip ]; then
            powershell -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath '$name.zip'"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  # Checksums, release notes and build-provenance attestation over everything the build jobs made.
  # Runs for the rehearsal too, so attestation is proved before a real tag.
  package:
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS and release notes
        env:
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          ls -l
          # Only the files to publish are in dist/. Sorted, so the file is stable.
          sha256sum $(ls | grep -v '^SHA256SUMS$' | LC_ALL=C sort) > SHA256SUMS
          cat SHA256SUMS
          cd ..
          sed -e "s|@TAG@|$TAG|g" -e "s|@VERSION@|$VERSION|g" -e "s|@BIN@|$BIN_NAME|g" \
              -e "s|@REPO@|$GITHUB_REPOSITORY|g" \
              .github/release-notes.md > dist-notes.md
          if grep -q '@[A-Z]*@' dist-notes.md; then echo "::error::unfilled placeholder in the release notes"; exit 1; fi
          cat dist-notes.md
      - name: Attest build provenance
        # actions/attest v4.2.2. Public repository: signed through the public Sigstore instance, no secret.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            dist/*
            dist-notes.md
          retention-days: 14
          if-no-files-found: error

  # Tag pushes only. Creates a draft; a maintainer publishes it after reading it.
  draft-release:
    needs: [meta, package]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: out
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$BIN_NAME $TAG" --notes-file out/dist-notes.md)
          case "$TAG" in *-*) args+=(--prerelease) ;; esac
          # gh fails if a release for this tag already exists; that is intended.
          gh release create "$TAG" "${args[@]}" out/dist/*
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets \
            --jq '"draft=\(.isDraft) assets=\(.assets | length)"'

  # crates.io readiness. Read-only: lists what would be packaged, checks whether each package name is
  # free on crates.io and runs `cargo publish --dry-run`. Nothing is uploaded and no registry token
  # is used. It is non-blocking (continue-on-error) until the crates are prepared for publishing;
  # the step summary says what is still missing. See docs/RELEASING.md, "crates.io".
  crates-dry-run:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - name: Are the package names free on crates.io?
        run: |
          set -uo pipefail
          for n in $(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; [print(p["name"]) for p in json.load(sys.stdin)["packages"]]'); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -A "${GITHUB_REPOSITORY} release readiness" "https://crates.io/api/v1/crates/$n")
            echo "$n: HTTP $code (404 = free, 200 = already taken)"
          done
      - name: What each package would contain
        run: |
          for p in $(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; [print(p["name"]) for p in json.load(sys.stdin)["packages"]]'); do
            echo "== $p"
            cargo package --list --locked --allow-dirty -p "$p" || echo "::warning::cargo package --list failed for $p"
          done
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --workspace --locked
