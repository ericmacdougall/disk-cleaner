name: Pages

# Publishes the static site in site/ to GitHub Pages. Pages must be enabled in the
# repository settings (Source: GitHub Actions) by a maintainer; this file does not do that.
# Until then the gate job finds Pages off and the deploy job is skipped, so the run stays green.
# The automatic push trigger was removed so this no longer consumes
# GitHub-hosted Actions minutes. Deploy by hand when minutes are available:
#   gh workflow run pages.yml
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Read-only: asks the API whether Pages is enabled with GitHub Actions as its source. Not enabled
  # means skip; an API or token failure fails this job instead of being read as "not enabled".
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: gate
        name: Is Pages enabled?
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I site/tools/pages_gate.py

  # Skipped at job level when the gate says no, so the github-pages environment is not touched.
  deploy:
    needs: gate
    if: needs.gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Site tests
        run: python3 -m unittest discover -s site/tests -v
      # Contributor docs, tests and tools are not part of the public page. Same script as the rehearsal
      # in site.yml, so the rehearsal cannot drift from this deploy.
      - name: Prepare the publishable site
        run: python3 site/tools/prepare.py _site
      # actions/configure-pages v6.0.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      # actions/upload-pages-artifact v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site
      # actions/deploy-pages v5.0.1
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
