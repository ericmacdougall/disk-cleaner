name: e2e-probe

# Temporary harness probe for the WebDriver checks (PR gate F1): runs only on probe/**
# branches. Runs the unpatched suite on Linux and on Windows. Not a gate.

on:
  push:
    branches: ["probe/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: suite (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            apps/desktop/src-tauri
            .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: System libraries, WebKitWebDriver, strace and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb strace
      - name: tauri-driver
        run: cargo install tauri-driver --locked --version 2.1.0
      - name: Frontend and icons
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npx tauri icon app-icon.svg
      - name: Builds
        working-directory: apps/desktop
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          npx tauri build --ci --no-bundle
          cp src-tauri/target/release/prunedisk-desktop "$RUNNER_TEMP/bin/release"
          npx tauri build --ci --no-bundle --features e2e --config e2e/automation.conf.json
          cp src-tauri/target/release/prunedisk-desktop "$RUNNER_TEMP/bin/e2e"
          (cd ../.. && cargo build --release --locked -p disk-cleaner-cli)
      - name: End-to-end checks
        working-directory: apps/desktop
        run: |
          export RELEASE_BIN="$RUNNER_TEMP/bin/release" E2E_BIN="$RUNNER_TEMP/bin/e2e"
          export CLI_BIN="$GITHUB_WORKSPACE/target/release/disk-cleaner" OUT="$RUNNER_TEMP/e2e"
          xvfb-run -a -s "-screen 0 1280x1024x24" bash e2e/check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-probe-linux
          path: |
            ${{ runner.temp }}/e2e/*.json
            ${{ runner.temp }}/e2e/*.txt
            !${{ runner.temp }}/e2e/before.json
            !${{ runner.temp }}/e2e/after.json
          retention-days: 7

  windows:
    name: suite (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            apps/desktop/src-tauri
            .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: tauri-driver
        shell: bash
        run: cargo install tauri-driver --locked --version 2.1.0
      - name: Edge driver matching the WebView2 runtime
        shell: pwsh
        run: |
          $wv = (Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -Directory |
            Where-Object Name -match '^\d+\.\d+\.\d+\.\d+$' | Sort-Object { [version]$_.Name } | Select-Object -Last 1).Name
          $have = (Get-Item "$env:EDGEWEBDRIVER\msedgedriver.exe").VersionInfo.ProductVersion
          "WebView2 runtime: $wv; runner's msedgedriver: $have"
          if ($have.Split('.')[0] -ne $wv.Split('.')[0]) {
            $dir = "$env:RUNNER_TEMP\edgedriver"
            New-Item -ItemType Directory -Force $dir | Out-Null
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$wv/edgedriver_win64.zip" -OutFile "$dir\d.zip"
            Expand-Archive "$dir\d.zip" $dir -Force
            "EDGEWEBDRIVER=$dir" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            "downloaded msedgedriver: $((Get-Item "$dir\msedgedriver.exe").VersionInfo.ProductVersion)"
          }
      - name: Builds
        working-directory: apps/desktop
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npx tauri icon app-icon.svg
          mkdir -p "$RUNNER_TEMP/bin"
          npx tauri build --ci --no-bundle
          cp src-tauri/target/release/prunedisk-desktop.exe "$RUNNER_TEMP/bin/release.exe"
          npx tauri build --ci --no-bundle --features e2e --config e2e/windows-automation.conf.json
          cp src-tauri/target/release/prunedisk-desktop.exe "$RUNNER_TEMP/bin/e2e.exe"
          (cd ../.. && cargo build --release --locked -p disk-cleaner-cli)
      - name: End-to-end checks
        working-directory: apps/desktop
        shell: bash
        run: |
          export RELEASE_BIN="$RUNNER_TEMP/bin/release.exe" E2E_BIN="$RUNNER_TEMP/bin/e2e.exe"
          export CLI_BIN="$GITHUB_WORKSPACE/target/release/disk-cleaner.exe" OUT="$RUNNER_TEMP/e2e"
          bash e2e/check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-probe-windows
          path: |
            ${{ runner.temp }}/e2e/*.json
            ${{ runner.temp }}/e2e/*.txt
            !${{ runner.temp }}/e2e/before.json
            !${{ runner.temp }}/e2e/after.json
          retention-days: 7
