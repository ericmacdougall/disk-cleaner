name: e2e-probe

# Harness probe for the WebDriver end-to-end checks (PR gate F1): runs only on probe/**
# branches, so it never runs the full ci and desktop matrix. Not a gate.

on:
  push:
    branches: ["probe/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  probe:
    name: probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: System libraries, WebKitWebDriver and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
          dpkg -s webkit2gtk-driver | grep -E '^(Package|Version)'
          command -v WebKitWebDriver
      - name: tauri-driver
        shell: bash
        run: |
          cargo install tauri-driver --locked --version 2.1.0
          tauri-driver --help | head -20 || true
      - name: Edge driver and WebView2 versions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          "WebView2 runtime: $((Get-ItemProperty $key).pv)"
          "EDGEWEBDRIVER: $env:EDGEWEBDRIVER"
          & "$env:EDGEWEBDRIVER\msedgedriver.exe" --version
      - name: Frontend and icons
        working-directory: apps/desktop
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npx tauri icon app-icon.svg
      - name: Build the release binary (production config, no bundle)
        working-directory: apps/desktop
        shell: bash
        run: |
          npx tauri build --ci --no-bundle
          ls -la src-tauri/target/release | grep -i prunedisk
      - name: Probe (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: xvfb-run -a node e2e/probe.mjs --app "$PWD/src-tauri/target/release/prunedisk-desktop" --out probe-linux.json
      - name: Probe (Windows)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: bash
        run: |
          node e2e/probe.mjs --app "$(cygpath -w "$PWD/src-tauri/target/release/prunedisk-desktop.exe")" \
            --native-driver "$(cygpath -w "$EDGEWEBDRIVER/msedgedriver.exe")" --out probe-windows.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: probe-${{ matrix.os }}
          path: apps/desktop/probe-*.json
          retention-days: 7
