name: e2e-probe

# Temporary harness probe for the WebDriver checks (PR gate F1): runs only on probe/**
# branches. Linux runs the unpatched suite; Windows collects launch diagnostics. Not a gate.

on:
  push:
    branches: ["probe/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: suite (ubuntu-22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            apps/desktop/src-tauri
            .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: System libraries, WebKitWebDriver, strace and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb strace
      - name: tauri-driver
        run: cargo install tauri-driver --locked --version 2.1.0
      - name: Frontend and icons
        working-directory: apps/desktop
        run: |
          npm ci --no-audit --no-fund
          npx tauri icon app-icon.svg
      - name: Builds
        working-directory: apps/desktop
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          npx tauri build --ci --no-bundle
          cp src-tauri/target/release/prunedisk-desktop "$RUNNER_TEMP/bin/release"
          npx tauri build --ci --no-bundle --features e2e --config e2e/automation.conf.json
          cp src-tauri/target/release/prunedisk-desktop "$RUNNER_TEMP/bin/e2e"
          (cd ../.. && cargo build --release --locked -p disk-cleaner-cli)
      - name: End-to-end checks
        working-directory: apps/desktop
        run: |
          export RELEASE_BIN="$RUNNER_TEMP/bin/release" E2E_BIN="$RUNNER_TEMP/bin/e2e"
          export CLI_BIN="$GITHUB_WORKSPACE/target/release/disk-cleaner" OUT="$RUNNER_TEMP/e2e"
          xvfb-run -a -s "-screen 0 1280x1024x24" bash e2e/check.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-probe-linux
          path: |
            ${{ runner.temp }}/e2e/*.json
            ${{ runner.temp }}/e2e/*.txt
            !${{ runner.temp }}/e2e/before.json
            !${{ runner.temp }}/e2e/after.json
          retention-days: 7

  windows:
    name: launch diagnostics (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Frontend, icons and the e2e build (shipped config)
        working-directory: apps/desktop
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npx tauri icon app-icon.svg
          npx tauri build --ci --no-bundle --features e2e
      - name: Diagnostics
        working-directory: apps/desktop
        shell: pwsh
        run: pwsh e2e/diag-windows.ps1 -Exe "$PWD\src-tauri\target\release\prunedisk-desktop.exe" -Out "$env:RUNNER_TEMP\diag"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-probe-windows-diag
          path: ${{ runner.temp }}/diag/
          retention-days: 7
