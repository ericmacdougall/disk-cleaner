# Read-only guard (spec AC-6). The same list is in crates/view, crates/tui and
# apps/desktop/src-tauri; scripts/check-readonly.sh checks that every entry stays in all three
# and that `allow(clippy::disallowed_methods)` appears only on the functions named in
# scripts/readonly-allow.txt. Entries for another platform or a crate a package does not use
# carry `allow-invalid = true`.
disallowed-methods = [
  { path = "std::fs::write", reason = "read-only: writes a file" },
  { path = "std::fs::remove_file", reason = "read-only: deletes a file" },
  { path = "std::fs::remove_dir", reason = "read-only: deletes a folder" },
  { path = "std::fs::remove_dir_all", reason = "read-only: deletes a tree" },
  { path = "std::fs::rename", reason = "read-only: moves a file" },
  { path = "std::fs::copy", reason = "read-only: writes a file" },
  { path = "std::fs::hard_link", reason = "read-only: creates a link" },
  { path = "std::fs::soft_link", reason = "read-only: creates a link" },
  { path = "std::fs::set_permissions", reason = "read-only: changes permissions" },
  { path = "std::fs::create_dir", reason = "read-only: creates a folder" },
  { path = "std::fs::create_dir_all", reason = "read-only: creates folders" },
  { path = "std::fs::DirBuilder::create", reason = "read-only: creates folders" },
  { path = "std::fs::File::create", reason = "read-only: creates or truncates a file" },
  { path = "std::fs::File::create_new", reason = "read-only: creates a file" },
  { path = "std::fs::File::set_len", reason = "read-only: truncates a file" },
  { path = "std::fs::File::set_times", reason = "read-only: changes file times" },
  { path = "std::fs::File::set_modified", reason = "read-only: changes file times" },
  { path = "std::fs::File::set_permissions", reason = "read-only: changes permissions" },
  { path = "std::fs::OpenOptions::open", reason = "read-only: may create, truncate or write" },
  { path = "std::os::unix::fs::symlink", reason = "read-only: creates a link", allow-invalid = true },
  { path = "std::os::windows::fs::symlink_file", reason = "read-only: creates a link", allow-invalid = true },
  { path = "std::os::windows::fs::symlink_dir", reason = "read-only: creates a link", allow-invalid = true },
  { path = "std::process::Command::new", reason = "read-only: only the analysis worker re-exec may spawn" },
  { path = "disk_cleaner_core::write_json", reason = "read-only: writes a file" },
  { path = "tokio::fs::write", reason = "read-only: writes a file", allow-invalid = true },
  { path = "tokio::fs::remove_file", reason = "read-only: deletes a file", allow-invalid = true },
  { path = "tokio::fs::remove_dir", reason = "read-only: deletes a folder", allow-invalid = true },
  { path = "tokio::fs::remove_dir_all", reason = "read-only: deletes a tree", allow-invalid = true },
  { path = "tokio::fs::rename", reason = "read-only: moves a file", allow-invalid = true },
  { path = "tokio::fs::copy", reason = "read-only: writes a file", allow-invalid = true },
  { path = "tokio::fs::hard_link", reason = "read-only: creates a link", allow-invalid = true },
  { path = "tokio::fs::symlink", reason = "read-only: creates a link", allow-invalid = true },
  { path = "tokio::fs::set_permissions", reason = "read-only: changes permissions", allow-invalid = true },
  { path = "tokio::fs::create_dir", reason = "read-only: creates a folder", allow-invalid = true },
  { path = "tokio::fs::create_dir_all", reason = "read-only: creates folders", allow-invalid = true },
  { path = "tokio::fs::File::create", reason = "read-only: creates or truncates a file", allow-invalid = true },
  { path = "tokio::fs::OpenOptions::open", reason = "read-only: may create, truncate or write", allow-invalid = true },
  { path = "tokio::process::Command::new", reason = "read-only: spawns a process", allow-invalid = true },
]
